<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C21 Online · School, rewritten as open source</title>
<meta name="description" content="Consensus21 online: real projects, mentors instead of teachers, a calendar you run yourself and a portfolio on Nostr. For home educators everywhere.">
<meta name="theme-color" content="#081b2a">
<link rel="icon" type="image/png" href="https://consensus21.school/assets/icon-192.png">
<link rel="apple-touch-icon" href="https://consensus21.school/assets/icon-192.png">
<meta property="og:image" content="https://consensus21.school/assets/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#081b2a;--navy2:#0f2a40;--navy3:#163a57;--paper:#f6f3ec;--card:#fff;--line:#e4dfd4;--ink:#0d1b26;--muted:#5b6670;
  --orange:#f7931a;--teal:#1fa6a0;--blue:#2f6fde;--green:#3aa65a;--yellow:#f2c230;--red:#e0533d;--violet:#7a5cd6;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:16.5px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.12;margin:0 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5vw,3.6rem)}h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}h3{font-size:1.18rem}
a{color:var(--blue)}code{font-family:"JetBrains Mono",monospace;background:#efe9dc;padding:2px 7px;border-radius:7px;font-size:.9em}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}.pad{padding-top:72px;padding-bottom:72px}.narrow{max-width:860px}
.eyebrow{font-family:"Space Grotesk",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:700;color:var(--orange);margin-bottom:10px}
.lead{font-size:1.14rem;color:var(--muted);max-width:740px}.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}.mt{margin-top:18px}
.mono{font-family:"JetBrains Mono",monospace}.break{word-break:break-all}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.center-y{align-items:center}
.grid{display:grid;gap:18px}.grid>*{min-width:0}body{overflow-x:hidden}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* nav */
header{position:sticky;top:0;z-index:30;background:rgba(8,27,42,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
header .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:8px;object-fit:contain}.mini-cube{display:grid;grid-template-columns:repeat(3,7px);gap:2px;animation:spin 8s linear infinite}.mini-cube i{width:7px;height:7px;border-radius:2px}
@keyframes spin{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(90deg)}}
#nav{display:flex;gap:2px;flex:1}#nav a{color:#c3d3e1;text-decoration:none;padding:8px 12px;border-radius:999px;font-size:.92rem;transition:.2s}
#nav a:hover,#nav a.on{background:var(--navy3);color:#fff}
#navcta .me{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:.9rem}
#burger{display:none;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
@media(max-width:900px){#burger{display:block}#nav{position:fixed;top:64px;left:0;right:0;flex-direction:column;background:var(--navy);padding:12px;display:none}body.navopen #nav{display:flex}#navcta .me span{display:none}}

/* buttons, inputs, cards */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:var(--navy);font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1rem;border:0;border-radius:999px;padding:12px 22px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 6px 18px -8px rgba(247,147,26,.7)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(247,147,26,.8)}.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;box-shadow:none;opacity:.9}.btn.ghost.light{color:#fff}
.btn.small{padding:7px 14px;font-size:.88rem}.btn:disabled{opacity:.5;cursor:default;transform:none}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid #d4ccbd;border-radius:11px;font:inherit;background:#fff;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px rgba(247,147,26,.15)}
textarea{min-height:100px;resize:vertical}label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 6px}
label.check{display:flex;gap:10px;font-weight:400;align-items:flex-start}label.check input{width:auto;margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}.card.bad,.bad{border-color:#f2b3a8;background:#fdeeea}
.card.dark{background:var(--navy);color:#fff;border-color:var(--navy3)}.card.glow{border:2px solid var(--orange);box-shadow:0 0 0 6px rgba(247,147,26,.1)}
.lift{transition:transform .25s,box-shadow .25s;text-decoration:none;color:inherit;display:block}.lift:hover{transform:translateY(-5px);box-shadow:0 20px 40px -22px rgba(8,27,42,.45)}
button.card{font:inherit;text-align:left;cursor:pointer}
.icon{font-size:1.9rem;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--navy);color:#fff;margin:2px}
.pill.soft{background:#ece6d9;color:var(--ink);font-weight:600}
.ticks{list-style:none;padding:0;margin:10px 0}.ticks li{padding:6px 0 6px 28px;position:relative}.ticks li::before{content:"✓";position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:.72rem;display:grid;place-items:center}
.safe{background:#eef7ef;border:1px solid #bfe0c4;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:.92rem}
.keybox{background:#f1ece2;padding:12px;border-radius:10px}

/* reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--delay,0s),transform .7s cubic-bezier(.2,.7,.2,1) var(--delay,0s)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.cube3d,.mini-cube,.blob{animation:none!important}}

/* hero */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:80px 0 96px}
.hero .lead{color:#c3d3e1}.grad{background:linear-gradient(90deg,var(--orange),var(--yellow),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 6s ease-in-out infinite}
@keyframes shine{50%{background-position:100%}}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;position:relative;z-index:1}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 14s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--blue);top:-120px;right:-80px}.b2{width:360px;height:360px;background:var(--orange);bottom:-160px;left:-100px;animation-delay:-6s;opacity:.22}
@keyframes float{50%{transform:translate(40px,30px) scale(1.1)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px}
.stats b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;font-size:2rem;color:var(--orange)}.stats span{font-size:.8rem;color:#9fb6c8}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.cube-stage{perspective:1100px;height:360px;display:grid;place-items:center}
.cube3d{width:220px;height:220px;position:relative;transform-style:preserve-3d;animation:rot 18s linear infinite}
@keyframes rot{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.face{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:#05121d;border-radius:18px;box-shadow:inset 0 0 0 2px #0c2335}
.face i{border-radius:10px;animation:pulse 4s ease-in-out infinite var(--d)}
.face span{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-size:.8rem;color:#c3d3e1;letter-spacing:.06em}
@keyframes pulse{50%{filter:brightness(1.25)}}
.f0{transform:translateZ(110px)}.f1{transform:rotateY(90deg) translateZ(110px)}.f2{transform:rotateY(180deg) translateZ(110px)}.f3{transform:rotateY(-90deg) translateZ(110px)}.f4{transform:rotateX(90deg) translateZ(110px)}.f5{transform:rotateX(-90deg) translateZ(110px)}
.f0 i:nth-child(3n+1),.f3 i:nth-child(2n){background:var(--orange)}.f0 i:nth-child(3n+2),.f4 i{background:var(--teal)}.f0 i:nth-child(3n),.f5 i:nth-child(odd){background:var(--blue)}
.f1 i{background:var(--green)}.f1 i:nth-child(5),.f2 i:nth-child(odd){background:var(--yellow)}.f2 i:nth-child(even){background:var(--red)}.f3 i:nth-child(odd){background:var(--violet)}.f5 i:nth-child(even){background:var(--orange)}.f4 i:nth-child(5){background:var(--yellow)}

/* bands, week, steps, terminal */
.band{background:var(--navy);color:#fff}.band .lead{color:#c3d3e1}.band .muted{color:#9fb6c8}
.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.weekgrid:has(.day:nth-child(6)){grid-template-columns:repeat(6,1fr)}.weekgrid:has(.day:nth-child(7)){grid-template-columns:repeat(7,1fr)}
@media(max-width:900px){.weekgrid,.weekgrid:has(.day:nth-child(6)),.weekgrid:has(.day:nth-child(7)){grid-template-columns:1fr 1fr}}@media(max-width:560px){.weekgrid{grid-template-columns:1fr!important}}
.day{background:var(--navy2);border:1px solid var(--navy3);border-radius:14px;padding:14px;color:#fff}
.weekgrid.light .day{background:#fff;color:var(--ink);border-color:var(--line)}
.day h4{font-size:1.02rem;margin-bottom:10px}.day h4 small{display:block;font-family:Inter;font-weight:500;color:#8fb0c9;font-size:.76rem}
.blk{border-left:4px solid var(--c);background:rgba(127,160,190,.1);border-radius:8px;padding:8px 10px;margin-bottom:7px;transition:transform .2s;position:relative}.blk:hover{transform:translateX(3px)}
.blk .t{font-size:.72rem;opacity:.75}.blk .n{font-weight:600;font-size:.9rem}.blk .mine{position:absolute;top:6px;right:8px;font-size:.62rem;font-weight:700;text-transform:uppercase;opacity:.6}
.tznote{margin-top:10px}
.steps{display:flex;flex-direction:column;gap:10px}.step{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.step b{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--orange);font-size:1.3rem}
.terminal{background:#05121d;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(8,27,42,.6);min-height:360px}
.tbar{display:flex;gap:7px;align-items:center;padding:12px 14px;background:#0c2335}.tbar i{width:11px;height:11px;border-radius:50%;background:#e0533d}.tbar i:nth-child(2){background:#f2c230}.tbar i:nth-child(3){background:#3aa65a}.tbar span{margin-left:8px;color:#8fb0c9;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.8rem}
.terminal pre{margin:0;padding:18px;color:#d6e4ef;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86rem;white-space:pre-wrap;line-height:1.8}
.terminal .cmd{color:#fff}.terminal .outl{color:var(--green)}.caret{animation:blink 1s step-end infinite;color:var(--orange)}@keyframes blink{50%{opacity:0}}

/* heatmap and repos */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:#ebe5d8}.card.dark .heat i{background:#163a57}
.heat i.l1{background:#9be9a8}.heat i.l2{background:#40c463}.heat i.l3{background:#30a14e}.heat i.l4{background:#216e39}.heat i.future{background:transparent}
.heat.demo i{opacity:0;animation:pop .4s forwards var(--d)}@keyframes pop{to{opacity:1}}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;background:#ebe5d8;margin:0 1px;vertical-align:middle}.legend .l1{background:#9be9a8}.legend .l2{background:#40c463}.legend .l3{background:#30a14e}.legend .l4{background:#216e39}
.repo b{font-family:"Space Grotesk",system-ui,sans-serif}.repo.mini{background:rgba(255,255,255,.06);border-radius:12px;padding:12px}
.clone{display:block;margin-top:6px;font-size:.72rem;word-break:break-all}
.profile{display:grid;grid-template-columns:280px 1fr;gap:36px}@media(max-width:860px){.profile{grid-template-columns:1fr}}
.pside h1{font-size:1.7rem;word-break:break-word}.pside .avatar{width:100%;max-width:240px;height:auto;margin-bottom:14px}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}.tl{position:relative;margin-bottom:12px}.tl .dot{position:absolute;left:-28px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--paper)}

/* lessons */
.program{border-top:5px solid var(--accent)}.pc-icon{font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 18%,white);margin-bottom:12px}
.pc-icon.big{width:84px;height:84px;font-size:3rem;flex:none}.pc-meta{margin-top:10px}
.phead{display:flex;gap:22px;align-items:flex-start;margin-top:14px}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
.lrow:hover{transform:translateX(6px);box-shadow:0 10px 28px -18px rgba(8,27,42,.5)}.lrow small{display:block}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ece6d9;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700}.num.done{background:var(--green);color:#fff}
.steps-list{list-style:none;padding:0;counter-reset:s}.steps-list li{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.steps-list span{flex:none;width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--orange);display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700}.steps-list p{margin:5px 0 0}

/* flow, plans */
.flow{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap}.node{flex:1 1 180px;background:var(--navy2);border:1px solid var(--navy3);border-radius:16px;padding:18px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700}
.node small{display:block;font-family:Inter;font-weight:400;color:#9fb6c8;margin-top:6px}.node.hub{border-color:var(--orange);box-shadow:0 0 30px -8px rgba(247,147,26,.5);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 50px -6px rgba(247,147,26,.7)}}.arrow{display:grid;place-items:center;color:var(--orange);font-size:1.4rem}
.plan{position:relative;color:var(--ink)}.plan.featured{border:2px solid var(--orange);transform:scale(1.03)}.plan .tag{position:absolute;top:-12px;left:20px;background:var(--orange);color:var(--navy);font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:999px}
.price{font-family:"Space Grotesk",system-ui,sans-serif;font-size:2.2rem;font-weight:700}.price small{font-size:.95rem;color:var(--muted)}
.invoice{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}@media(max-width:640px){.invoice{grid-template-columns:1fr}}
.qr svg{width:100%;height:auto;background:#fff;border-radius:12px}.qr.big{max-width:260px;margin:12px auto}
.paid{font-size:1.6rem;font-family:"Space Grotesk",system-ui,sans-serif;background:#e9f7ec;border:2px solid var(--green);border-radius:16px;padding:24px;text-align:center;animation:pop .4s}

/* app bits */
.ring{--p:0;width:120px;height:120px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#ece6d9 0);transition:--p 1s}
.ring span{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.6rem;font-weight:700}.ring small{font-size:.8rem;color:var(--muted)}
.stages{display:flex;gap:6px;flex-wrap:wrap}.stage{padding:6px 14px;border-radius:999px;background:#ece6d9;font-weight:600;border:0;font:inherit;font-size:.86rem;cursor:pointer}.stage.on{background:var(--teal);color:#fff}
.bar{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;font-size:.86rem;margin-bottom:6px}.bar i{height:8px;border-radius:9px;background:#ece6d9;position:relative;overflow:hidden}.bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c);border-radius:9px}
.kid{margin:8px 0}.kidcard{margin-bottom:16px}.note{border-left:3px solid var(--green);padding:6px 12px;margin:8px 0;background:#f8f5ee;border-radius:0 10px 10px 0}.note p{margin:4px 0 0}
.brow{display:grid;grid-template-columns:70px 90px 90px 1fr 100px 30px;gap:6px;margin-top:6px}.brow input,.brow select{padding:7px 8px;font-size:.85rem}
.x{background:none;border:0;color:var(--red);font-size:1.1rem;cursor:pointer}
.msgs{display:grid;grid-template-columns:260px 1fr;gap:16px}@media(max-width:760px){.msgs{grid-template-columns:1fr}}
.rooms button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font:inherit;cursor:pointer}.rooms button.on{border-color:var(--orange);background:#fff7ea}.rooms small{display:block;color:var(--muted)}
.rooms:empty{display:none}.msgs:has(.rooms:empty){grid-template-columns:1fr}
.thread{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto}
.msg{max-width:78%;background:#f4f0e7;border-radius:14px;padding:10px 14px;animation:pop .3s}.msg.me{align-self:flex-end;background:#fff1dc}.msg .meta{font-size:.74rem;color:var(--muted)}.msg p{margin:2px 0 0;white-space:pre-wrap}
.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin:10px 0}.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}

/* loader, toast, modal */
.loader{display:flex;gap:8px;justify-content:center;padding:30px}.loader span{width:12px;height:12px;border-radius:3px;background:var(--orange);animation:bounce 1s infinite}.loader span:nth-child(2){background:var(--teal);animation-delay:.15s}.loader span:nth-child(3){background:var(--blue);animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-10px) rotate(45deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;transition:.3s;max-width:90vw;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(8,27,42,.6);display:grid;place-items:center;z-index:50;opacity:0;transition:.25s;padding:16px}.modal.show{opacity:1}
.modal-card{background:#fff;border-radius:20px;padding:28px;max-width:520px;width:100%;transform:scale(.95);transition:.25s;max-height:90vh;overflow:auto}.modal.show .modal-card{transform:none}
footer{background:var(--navy);color:#9fb6c8;padding:48px 0;font-size:.9rem}footer a{color:#cfe0ee}footer .grid{grid-template-columns:2fr 1fr}@media(max-width:700px){footer .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="#/"><img class="logo" src="https://consensus21.school/assets/icon-192.png" alt="" width="32" height="32">C21 Online</a>
  <nav id="nav"></nav><div id="navcta"></div><button id="burger" aria-label="Menu">☰</button>
</div></header>
